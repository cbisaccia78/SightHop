services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: sighthop
      POSTGRES_PASSWORD: sighthop
      POSTGRES_DB: sighthop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sighthop -d sighthop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: apps/server/Containerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://sighthop:sighthop@postgres:5432/sighthop
      REDIS_URL: redis://redis:6379
      STUN_SERVER_URLS: ${STUN_SERVER_URLS:-}
      TURN_SERVER_URLS: ${TURN_SERVER_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Containerfile
    depends_on:
      - server
    ports:
      - "8080:80"

  coturn:
    image: docker.io/coturn/coturn:4.6
    profiles: ["turn"]
    command:
      - --no-cli
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-sighthop}
      - --user=${TURN_USERNAME:-sighthop}:${TURN_PASSWORD:-change-me-before-enabling}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"

volumes:
  postgres-data:
  redis-data:
