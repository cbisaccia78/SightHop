services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Containerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-sighthop}:${POSTGRES_PASSWORD:-sighthop}@host.containers.internal:${POSTGRES_HOST_PORT:-5432}/${POSTGRES_DB:-sighthop}}
      REDIS_URL: ${REDIS_URL:-redis://host.containers.internal:${REDIS_HOST_PORT:-6379}}
      STUN_SERVER_URLS: ${STUN_SERVER_URLS:-}
      TURN_SERVER_URLS: ${TURN_SERVER_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      DEPLOY_ADMIN_TOKEN: ${DEPLOY_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT}:3000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Containerfile
    depends_on:
      - server
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"