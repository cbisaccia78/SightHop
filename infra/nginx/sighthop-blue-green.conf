include /etc/nginx/conf.d/sighthop-active-release.conf;

map $cookie_sighthop_release $sighthop_release {
  default $sighthop_default_release;
  ~^(blue|green)$ $cookie_sighthop_release;
}

map $sighthop_release $sighthop_web_upstream {
  default http://127.0.0.1:18080;
  blue http://127.0.0.1:18080;
  green http://127.0.0.1:28080;
}

map $sighthop_release $sighthop_server_upstream {
  default http://127.0.0.1:13000;
  blue http://127.0.0.1:13000;
  green http://127.0.0.1:23000;
}

server {
  listen 80;
  server_name app.example.com;

  location /api/ {
    add_header Set-Cookie "sighthop_release=$sighthop_release; Path=/; Max-Age=86400; SameSite=Lax" always;
    proxy_pass $sighthop_server_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    add_header Set-Cookie "sighthop_release=$sighthop_release; Path=/; Max-Age=86400; SameSite=Lax" always;
    proxy_pass $sighthop_server_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Set-Cookie "sighthop_release=$sighthop_release; Path=/; Max-Age=86400; SameSite=Lax" always;
    proxy_pass $sighthop_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}